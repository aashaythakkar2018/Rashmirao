services:
  - type: web
    name: rhytara-certificates
    runtime: node
    plan: free
    rootDir: certificate-automation
    buildCommand: npm install && npm run build
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: EMAIL_PROVIDER
        value: gmail
      - key: EMAIL_FROM
        value: "Rhytara <rhytaracollections@gmail.com>"
      - key: EMAIL_REPLY_TO
        value: rhytaracollections@gmail.com
      - key: GMAIL_USER
        value: rhytaracollections@gmail.com
      - key: GMAIL_APP_PASSWORD
        sync: false # paste the App Password in Render's dashboard - never in this file
      - key: CERTIFICATE_STORAGE_PROVIDER
        value: local # see certificate-automation/README.md section 11 - upgrade to S3 before real production use
      - key: CERTIFICATE_LINK_SECRET
        generateValue: true
      - key: APP_BASE_URL
        value: https://dashboard.rhytara.com
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false # paste your Neon (or other Postgres) connection string in Render's dashboard
      - key: CERTIFICATE_TEST_MODE
        value: "true" # flip to "false" in Render's dashboard once you've verified a real test certificate
      - key: TEST_EMAIL
        value: aashaythakkar2018@gmail.com
      - key: ADMIN_API_TOKEN
        generateValue: true
