<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Rhytara Certificate of Authenticity</title>
<link rel="stylesheet" href="certificate.css" />
</head>
<body>
  <div class="certificate">
    <img class="bg" src="{{background_url}}" alt="" />

    <div class="field field-edition">{{edition_number}}</div>
    <div class="field field-customer">{{customer_full_name}}</div>
  </div>
</body>
</html>
