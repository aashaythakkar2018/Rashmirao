<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rhytara — Certificate Dashboard</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="tokenGate" class="token-gate">
    <div class="token-card">
      <h1>Rhytara Certificate Dashboard</h1>
      <p>Enter the admin token for this backend (set as <code>ADMIN_API_TOKEN</code> in its environment).</p>
      <input id="tokenInput" type="password" placeholder="Admin token" autocomplete="off" />
      <button id="tokenSubmit" class="btn btn-primary">Enter</button>
      <p id="tokenError" class="token-error"></p>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="topbar-title">
        <h1>Rhytara Certificates</h1>
        <span id="modeBadge" class="badge"></span>
      </div>
      <div class="topbar-actions">
        <button id="refreshBtn" class="btn btn-ghost">↻ Refresh</button>
        <label class="auto-refresh">
          <input type="checkbox" id="autoRefreshToggle" checked />
          Auto-refresh (15s)
        </label>
        <button id="logoutBtn" class="btn btn-ghost">Sign out</button>
      </div>
    </header>

    <main class="content">
      <section class="stats-row" id="statsRow"></section>

      <section class="panel">
        <div class="panel-head">
          <h2>By design</h2>
        </div>
        <div class="table-wrap">
          <table id="productTable" class="table">
            <thead>
              <tr><th>Design</th><th>Code</th><th>Issued</th><th>Edition size</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Issue a new certificate</h2>
        </div>
        <form id="issueForm" class="issue-form">
          <div class="issue-grid">
            <label>
              <span>Order number</span>
              <input id="f_orderNumber" type="text" placeholder="e.g. 1042" required />
            </label>
            <label>
              <span>Design</span>
              <select id="f_designName" required>
                <option value="">Select a design…</option>
              </select>
            </label>
            <label>
              <span>Customer first name</span>
              <input id="f_firstName" type="text" required />
            </label>
            <label>
              <span>Customer last name</span>
              <input id="f_lastName" type="text" />
            </label>
            <label class="span-2">
              <span>Customer email</span>
              <input id="f_email" type="email" required />
            </label>
            <label>
              <span>Certificate number</span>
              <input id="f_certNumber" type="number" min="1" required />
              <span id="f_certHint" class="field-hint"></span>
            </label>
            <label>
              <span>Edition size (denominator)</span>
              <input id="f_editionTotal" type="number" min="1" />
              <span class="field-hint">Defaults to the design's configured size.</span>
            </label>
          </div>
          <div class="issue-actions">
            <button type="submit" id="issueSubmit" class="btn btn-primary">Issue certificate &amp; send</button>
            <span id="issueStatus" class="inline-status"></span>
          </div>
          <p id="issueError" class="form-error"></p>
        </form>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Certificates</h2>
        </div>
        <div class="filter-bar">
          <input id="searchInput" type="text" placeholder="Search name, email, order #, design, number…" />
          <select id="statusFilter">
            <option value="">All statuses</option>
            <option value="emailed">Emailed</option>
            <option value="generated">Generated (not emailed)</option>
            <option value="processing">Processing</option>
            <option value="pending">Pending</option>
            <option value="failed">Failed</option>
          </select>
          <select id="productFilter">
            <option value="">All designs</option>
          </select>
          <button id="filterApply" class="btn btn-secondary">Apply</button>
        </div>

        <div class="table-wrap">
          <table id="certTable" class="table">
            <thead>
              <tr>
                <th>Order</th>
                <th>Customer</th>
                <th>Design</th>
                <th>Edition</th>
                <th>Status</th>
                <th>Certificate</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="certTableBody"></tbody>
          </table>
        </div>

        <div class="pagination">
          <button id="prevPage" class="btn btn-ghost">‹ Prev</button>
          <span id="pageInfo"></span>
          <button id="nextPage" class="btn btn-ghost">Next ›</button>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
